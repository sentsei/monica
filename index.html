<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I Love You ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: black;
        }

        #startScreen {
            position: fixed;
            inset: 0;
            z-index: 10;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background: black;
            color: white;

            cursor: pointer;
            user-select: none;

            transition: opacity 0.8s ease;
        }

        #startScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #startScreen h1 {
            font-size: clamp(28px, 6vw, 60px);
            margin-bottom: 15px;
            text-align: center;

            text-shadow:
                0 0 10px #1e90ff,
                0 0 25px #00bfff,
                0 0 45px #4169e1;
        }

        #startScreen p {
            font-size: clamp(14px, 3vw, 22px);
            opacity: 0.8;
            text-align: center;
        }

        #hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);

            color: rgba(255, 255, 255, 0.45);
            font-size: 13px;

            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="startScreen">
        <h1>For You ❤️</h1>
        <p>Tap anywhere to begin</p>
    </div>

    <canvas id="canvas"></canvas>

    <div id="hint">
        Tap the screen if you want to replay
    </div>

    <audio id="music" src="love_you.mp3" preload="auto"></audio>

    <script src="script.js"></script>

</body>
</html>
